# XcodeGen spec (D3): the .xcodeproj is generated from this file and never committed.
#   cd App && xcodegen generate
name: FireWatchField
options:
  bundleIdPrefix: dev.ysaatci
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true

packages:
  FireWatchField:
    path: ..
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.19.0"

targets:
  FireWatchField:
    type: application
    platform: iOS
    sources:
      - FireWatchField
    dependencies:
      - package: FireWatchField
        product: FireWatchCore
      - package: FireWatchField
        product: FireWatchSimulator
      - package: FireWatchField
        product: FireWatchClient
      - package: FireWatchField
        product: FireWatchAPI
    info:
      path: FireWatchField/Info.plist
      properties:
        CFBundleDisplayName: FireWatch Field
        CFBundleLocalizations: [en, tr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: >-
          Your location ranks nearby hotspots first and lets the app alert you to new
          hotspots and flare-ups close to you.
        # Background refresh checks the server for nearby changes (FR-8, NFR-5).
        BGTaskSchedulerPermittedIdentifiers:
          - dev.ysaatci.firewatchfield.refresh
        UIBackgroundModes:
          - fetch
        # Plain HTTP only to local addresses, for the simulator server (NFR-8).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ysaatci.firewatchfield
        TARGETED_DEVICE_FAMILY: "1,2"
        # No app icon until M14 (presentation); XcodeGen otherwise expects one named AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FireWatchFieldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FireWatchFieldTests
    dependencies:
      - target: FireWatchField
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  FireWatchFieldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FireWatchFieldUITests
    dependencies:
      - target: FireWatchField
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  FireWatchField:
    build:
      targets:
        FireWatchField: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - FireWatchField
      targets:
        - FireWatchFieldTests
        - FireWatchFieldUITests
