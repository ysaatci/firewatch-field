name: ci-linux

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, simulator and API (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep in sync with docker/Dockerfile.dev.
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-swift6.3-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-swift6.3-

      - name: Lint
        run: swift format lint --strict --recursive --parallel Package.swift Sources Tests Server/Package.swift Server/Sources Server/Tests App

      - name: Build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --skip-build

      - name: Coverage (FireWatchCore at least 80 %)
        run: scripts/coverage.sh 80

      - name: Smoke-test fwgen
        run: swift run fwgen --out /tmp/fixtures && test -s /tmp/fixtures/snapshot.json

  server:
    name: Simulator server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.3
    steps:
      # The checkout directory is named after the repository, which the Server package's
      # path dependency on the root package relies on.
      - uses: actions/checkout@v7

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: Server/.build
          key: spm-server-${{ runner.os }}-swift6.3-${{ hashFiles('Server/Package.resolved', 'Package.swift') }}
          restore-keys: spm-server-${{ runner.os }}-swift6.3-

      - name: Build (warnings are errors)
        run: swift build --package-path Server --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --package-path Server --skip-build
