name: ci-ios

# macOS minutes are the expensive ones, so this runs on main and pull requests only (D13).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: Record new snapshot reference images instead of comparing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build and test the app (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          udid="$(scripts/ci/pick-simulator.sh)"
          echo "Using simulator $udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Build
        run: >
          xcodebuild build-for-testing
          -project App/FireWatchField.xcodeproj
          -scheme FireWatchField
          -destination "id=$SIMULATOR"
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: Boot the simulator near the fire, with location allowed
        run: |
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b
          # No permission prompt in UI tests, and a position by where the demo fire starts, so
          # distances, ranking and alerts are exercised.
          xcrun simctl privacy "$SIMULATOR" grant location dev.ysaatci.firewatchfield
          xcrun simctl location "$SIMULATOR" set 36.826,31.456

      - name: Start screen recording
        run: |
          mkdir -p artifacts
          xcrun simctl io "$SIMULATOR" recordVideo --codec h264 --force artifacts/ui-tests.mp4 &
          echo "RECORDER=$!" >> "$GITHUB_ENV"

      - name: Test
        env:
          TEST_RUNNER_SNAPSHOT_RECORD: ${{ inputs.record_snapshots && '1' || '0' }}
        run: >
          xcodebuild test-without-building
          -project App/FireWatchField.xcodeproj
          -scheme FireWatchField
          -destination "id=$SIMULATOR"
          -derivedDataPath DerivedData
          -resultBundlePath artifacts/Tests.xcresult

      - name: Snapshot tests in Turkish
        if: always()
        env:
          TEST_RUNNER_SNAPSHOT_RECORD: ${{ inputs.record_snapshots && '1' || '0' }}
        run: >
          xcodebuild test-without-building
          -project App/FireWatchField.xcodeproj
          -scheme FireWatchField
          -destination "id=$SIMULATOR"
          -derivedDataPath DerivedData
          -only-testing:FireWatchFieldTests/SnapshotTests
          -testLanguage tr -testRegion TR
          -resultBundlePath artifacts/SnapshotsTR.xcresult

      - name: Upload snapshot images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: App/FireWatchFieldTests/__Snapshots__
          if-no-files-found: ignore

      - name: Export screenshots
        if: always()
        run: scripts/ci/export-screenshots.sh artifacts/Tests.xcresult artifacts/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: warn

      - name: Stop screen recording
        if: always()
        run: |
          if [ -n "${RECORDER:-}" ]; then kill -INT "$RECORDER" || true; sleep 3; fi
          ls -la artifacts/ui-tests.mp4 || true

      - name: Upload screen recording
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-video
          path: artifacts/ui-tests.mp4
          if-no-files-found: warn
